name: Publish Windows release

on:
  workflow_run:
    workflows: ["Tests (Windows)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate main, version and release state
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$sha" != "$latest" ]]; then
            echo "Commit is no longer the current main; release skipped."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(cat VERSION)"
          python - <<'PY'
          import pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          assert pathlib.Path("VERSION").read_text(encoding="utf-8").strip() == version
          PY
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Package clean Windows ZIP
        if: steps.check.outputs.publish == 'true'
        run: python scripts/build_release.py
      - name: Publish GitHub release and ZIP
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          SHA: ${{ steps.check.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/doc-to-md-converter-${TAG}-windows.zip" \
            --target "$SHA" \
            --title "DOCX / PDF → Markdown ${TAG} (Windows)" \
            --notes-file RELEASE_NOTES.md
