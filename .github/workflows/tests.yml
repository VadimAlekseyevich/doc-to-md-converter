name: Tests (Windows)

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "setuptools>=68" wheel -e ".[dev]"
      - run: python -m pytest -q
      - name: Register, verify and remove per-user DOCX and PDF context verbs
        shell: pwsh
        run: |
          cmd /c install-context-menu.bat
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
          foreach ($ext in @('.docx', '.pdf')) {
            $key = "HKCU:\Software\Classes\SystemFileAssociations\$ext\shell\DocToMdConverter\command"
            $value = (Get-Item $key).GetValue('')
            if (-not $value.Contains('start.bat') -or -not $value.Contains('"%1"') -or -not $value.Contains('--context-menu')) {
              throw "Invalid registered command for $ext : $value"
            }
          }
          cmd /c uninstall-context-menu.bat
          if ($LASTEXITCODE -ne 0) { throw 'Uninstallation failed' }
          foreach ($ext in @('.docx', '.pdf')) {
            $key = "HKCU:\Software\Classes\SystemFileAssociations\$ext\shell\DocToMdConverter\command"
            if (Test-Path $key) { throw "Uninstallation failed for $ext" }
          }
      - name: First launcher run (offline, reuse installed dependencies)
        shell: cmd
        env:
          PIP_NO_INDEX: '1'
        run: call start.bat --help
      - name: Second launcher run (offline, no downloads)
        shell: cmd
        env:
          PIP_NO_INDEX: '1'
        run: call start.bat --help
