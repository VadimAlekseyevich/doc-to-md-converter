name: Tests (Windows)

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "setuptools>=68" wheel -e ".[dev]"
      - run: python -m pytest -q
      - name: Offline launcher smoke test (first and repeated run)
        shell: cmd
        env:
          PIP_NO_INDEX: '1'
        run: |
          call start.bat --help
          if errorlevel 1 exit /b 1
          call start.bat --help
