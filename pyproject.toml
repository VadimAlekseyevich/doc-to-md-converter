[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-to-md-converter"
version = "0.2.0"
description = "Convert DOCX and PDF teaching materials to GitHub-readable Markdown without OCR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1,<2",
    "lxml>=4.9,<7",
    "pypdfium2>=4.30,<6",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4,<5"]

[project.scripts]
docx-to-md = "doc_to_md_converter.cli:main"
document-to-md = "doc_to_md_converter.cli:main"
pdf-to-md = "doc_to_md_converter.cli:main"

[tool.setuptools.packages.find]
include = ["doc_to_md_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
